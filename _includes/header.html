<header class='site-header'>
  <div class='container'>
    <a id='site-header-brand' href='{{ '/' | relative_url }}' title='{{ site.name | escape }}'>
      <img
        class='site-brand-logo'
        src='{{ '/assets/images/zyraxi_round.svg' | relative_url }}'
        alt=''
        width='50'
        height='50'
      >
      <span class='site-brand-name'>{{ site.name | escape }}</span>
    </a>
    <button
      class='site-nav-toggle'
      type='button'
      aria-expanded='false'
      aria-controls='site-navigation'
      aria-label='展开导航菜单'
      hidden
    >
      <span>菜单</span>
      <svg
        width='18'
        height='18'
        viewBox='0 0 24 24'
        fill='none'
        stroke='currentColor'
        stroke-width='2'
        aria-hidden='true'
      >
        <path d='M3 5h18M3 12h18M3 19h18'></path>
      </svg>
    </button>
    <nav id='site-navigation' class='site-header-nav' aria-label='主导航'>
      {% for nav in site.navs %}
        <a
          href='{{ nav.href | relative_url }}'
          class='{% if page.menu == nav.label or page.url == nav.href %} selected {% endif %} site-header-nav-item hvr-underline-from-center'
          target='{{ nav.target | default: '_self' }}'
          {% if nav.target == '_blank' %}
            rel='noopener noreferrer'
          {% endif %}
          title='{{ nav.label | escape }}'
        >
          {{ nav.label | escape }}
        </a>
      {% endfor %}
    </nav>
  </div>
</header>
