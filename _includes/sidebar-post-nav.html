<h3 class="directory-title">目录</h3>
<div id="post-directory-module">
<section class="post-directory">
    <!-- Links that trigger the jumping -->
    <!-- Added by javascript below -->
    <dl></dl>
</section>
</div>

<script type="text/javascript">

    $(document).ready(function(){
                $( "article h1, article h2, article h3" ).not(".directory-title, #post-directory-module h1, #post-directory-module h2, #post-directory-module h3").each(function( index ) {
            var tagName = this.tagName.toLowerCase();
            var wrapperTag = tagName === "h3" ? "dd" : "dt";
            var wrapperClass = "toc-" + tagName;
            var prefix = tagName === "h3" ? "&nbsp;&nbsp;- " : "";
            $(".post-directory dl").append("<" + wrapperTag + " class=\"" + wrapperClass + "\"><a class=\"jumper\" hre=#" +
                    $(this).attr("id")
                    + ">"
                    + prefix + $(this).html()
                    + "</a></" + wrapperTag + ">");
        });

        var fixmeTop = $('#post-directory-module').offset().top - 100;       // get initial position of the element

        $(window).scroll(function() {                  // assign scroll event listener

            var currentScroll = $(window).scrollTop(); // get current position

            if (currentScroll >= fixmeTop) {           // apply position: fixed if you
                $('#post-directory-module').css({      // scroll to that element or below it
                    top: '100px',
                    position: 'fixed',
                    width: 'inherit'
                });
            } else {                                   // apply position: static
                $('#post-directory-module').css({      // if you scroll above it
                    position: 'inherit',
                    width: 'inherit'
                });
            }

        });

        $("a.jumper").on("click", function( e ) {
            e.preventDefault();
            var id = $(this).attr('hre');
            var target = id ? document.getElementById(id.substring(1)) : null;
            if (target) {
                var top = $(target).offset().top - 100;
                $("html, body").stop(true, true).animate({ scrollTop: top }, 200);
            }
        });


          if (window.renderMathInElement) {
            renderMathInElement(document.querySelector('.post-directory'), {
              delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', inline: true},
                  {left: '\\(', right: '\\)', inline: true},
                  {left: '\\[', right: '\\]', display: true}
              ],
              throwOnError: false
            });
          }

    });

</script>
