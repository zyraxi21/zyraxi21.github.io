{% if site.disque and page.comments != false %}
  <div class='comments'>
    <div
      id='disqus_thread'
      data-disqus-host='{{ site.disque | escape }}'
      data-disqus-url='{{ page.url | absolute_url | escape }}'
      data-disqus-identifier='{{ page.id | default: page.url | escape }}'
    ></div>
    <noscript
      >请启用 JavaScript 查看由
      <a href='https://disqus.com/?ref_noscript' rel='nofollow'>Disqus</a> 提供的评论。</noscript
    >
  </div>
{% endif %}
