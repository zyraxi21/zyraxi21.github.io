<h3 class="sidebar-title">博客分类</h3>
<div id="blog-categories">
    <ul class="list-group">
        <li class="list-group-item category-filter" data-category="all">
            <a href="javascript:;" class="category-link">全部</a>
            <span class="badge">{{ site.posts.size }}</span>
        </li>
        {% for category in site.categories %}
        <li class="list-group-item category-filter" data-category="{{ category | first | downcase }}">
            <a href="javascript:;" class="category-link">{{ category | first }}</a>
            <span class="badge">{{ category[1].size }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
<script type="text/javascript">

    function applyCategoryFilter(selected) {
        $("#posts-list .posts-list-item").each(function() {
            var categories = ($(this).data("categories") || "").toString().toLowerCase();
            if (selected === "all" || categories.indexOf(selected) !== -1) {
                $(this).show();
            } else {
                $(this).hide();
            }
        });
    }

    function setActiveCategory(selected) {
        $("#blog-categories .category-filter").each(function() {
            var current = $(this).data("category").toString().toLowerCase();
            $(this).toggleClass("active", current === selected);
        });
    }

    $(document).ready(function(){
        $("#blog-categories li").css('text-transform','capitalize');

        $("#blog-categories .category-filter").on("click", function(e) {
            e.preventDefault();
            var selected = $(this).data("category").toString().toLowerCase();

            applyCategoryFilter(selected);
            setActiveCategory(selected);

            var url = new URL(window.location.href);
            if (selected === "all") {
                url.searchParams.delete("category");
            } else {
                url.searchParams.set("category", $(this).data("category"));
            }
            window.history.replaceState(null, "", url.toString());
        });

        var initialCategory = new URLSearchParams(window.location.search).get("category");
        if (initialCategory) {
            var selected = initialCategory.toString().toLowerCase();
            applyCategoryFilter(selected);
            setActiveCategory(selected);
        }
    });

</script>
