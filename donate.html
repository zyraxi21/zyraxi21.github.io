<!doctype html>
<html lang='zh-Hans-CN'>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>打赏</title>
    <link
      rel='shortcut icon'
      type='image/png'
      href='{{ '/assets/images/favicon.png' | relative_url }}'
    />
    <link rel='stylesheet' href='{{ '/assets/css/donate.css' | relative_url }}'>
  </head>

  <body class='other' data-donate-root='{{ '/assets/images/' | relative_url }}'>
    <div class='container'>
      <div class='title'>
        <img
          id='icon'
          src='{{ '/assets/images/orangePayLogo.jpg' | relative_url }}'
          width='48'
          height='48'
          alt='支付平台'
        >
        <h1>打赏</h1>
      </div>
      <div class='content'>
        <h3 id='tips'>可使用支付宝（推荐）、微信、QQ 客户端扫码付款</h3>
        <img
          id='qrcode'
          src='{{ '/assets/images/qrcode/donate.png' | relative_url }}'
          width='300'
          height='300'
          alt='捐赠二维码'
        >
        <h3>扫描或长按识别二维码，向我付款</h3>
        <br>
      </div>
    </div>
    <div style='text-align: center;color:#fff;font-size:14px'>
      声明：在本页面所进行的付款行为均为无偿捐赠，我不会对您有任何回报。如您通过本页面付款，即说明您已经阅读并同意本声明。
    </div>
    <script type='module' src='{{ '/assets/vendor/donate.js' | relative_url }}'></script>
  </body>
</html>
