# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: zyraxi
name: zyraxi
email: zyraxi@outlook.com
location: 中国，四川
company: 哈尔滨工业大学
company_url: https://www.hit.edu.cn/
github_url: https://github.com/zyraxi21
description: 编辑个签，展示我的独特态度
favicon: favicon.ico # Image must be in assets/images
repository: zyraxi21/zyraxi21.github.io

# Projects shown in the "我的项目" sidebar. Include user, fork and org repositories here.
projects:
  - name: zyraxi21.github.io
    link: https://github.com/zyraxi21/zyraxi21.github.io
    description: 个人网站源码
  - name: Yummy-Modern
    link: https://github.com/zyraxi21/Yummy-Modern
    description: Yummy Jekyll 模板的现代版
  - name: Android-NFC-Example
    link: https://github.com/Friends-of-zyraxi/Android-NFC-Example
    description: Android NFC 示例项目

url: https://zyraxi21.github.io

## Gem
plugins:
  - jekyll-paginate
  - jekyll-github-metadata

# Build settings
markdown: kramdown
highlighter: rouge
lsi:         false
excerpt_separator: "\n\n"
permalink: /blog/:title.html


source:      .
destination: ./_site

quiet:    false
defaults: []

kramdown:
  input: GFM
  math_engine: null
  smart_quotes: apos,apos,quot,quot

# Disque
disque: zyraxi.disqus.com

# Pagination
paginate: 10
paginate_path: 'page:num'

# Navigation. If you do not like these modules, just remove them :D
navs:
  -
    href: /
    label: 主页

  -
    href: /blog
    label: 博客

  -
    href: /about
    label: 关于

# Sidebar to show popular repo
side_bar_repo_limit: 5 # Number of repos to show


# For about.html. Fell free to create your own!
skill_software_keywords: [Java, C, C++, Qt, Python, MySQL, Oracle, SQLite, PL/SQL, Design Patterns]
skill_j2ee_keywords: [Spring, Struct, Hibernet, MyBatis, JSP]
skill_web_keywords: [HTML, CSS, JS, JQuery, Ajax, AngularJS, NodeJS, ExpressJS, MongoDB, Redis, PHP, Symfony, Boostrap]
skill_mobile_app_keywords: [Android, Sketch UI Desgin]

layout: default
comments: true
